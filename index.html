<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoPets Idle - Tip to Thrive</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js",
          "dompurify": "https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.min.js"
        }
      }
    </script>
</head>
<body>
    <div id="app"></div>
    
    <!-- Modals -->
    <div id="pet-creation-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Create Your NeoPet</h2>
            <div id="pet-creator">
                <input type="text" id="pet-name" placeholder="Pet Name" maxlength="20">
                <textarea id="pet-description" placeholder="Describe your pet's appearance..." rows="3"></textarea>
                <button id="generate-pet">Generate Pet</button>
                <div id="pet-preview"></div>
                <button id="confirm-pet" class="hidden">Adopt This Pet</button>
            </div>
        </div>
    </div>

    <div id="minigame-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Color Match</h2>
            <div id="minigame-container">
                <div id="color-display"></div>
                <div id="color-options"></div>
                <div id="game-score">Score: 0</div>
                <div id="game-timer">Time: 30</div>
            </div>
            <button id="close-minigame">Close</button>
        </div>
    </div>

    <script type="text/babel" src="game.js"></script>
    <script type="module" src="lobby.js"></script>

</body>
</html>
